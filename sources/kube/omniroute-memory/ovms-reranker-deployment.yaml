apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ovms-reranker
  name: ovms-reranker
  namespace: omniroute-memory
spec:
  # Keep one proven BGE reranker replica. Embeddings retain all four Arc nodes;
  # any topology change requires a separate contention benchmark.
  replicas: 1
  selector:
    matchLabels:
      app: ovms-reranker
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ovms-reranker
    spec:
      # Prefer a node without an embedding pod when spare Intel GPU capacity exists.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: ovms-embeddings
              topologyKey: kubernetes.io/hostname
      containers:
      - args:
        - --rest_port=8000
        - --model_name=bge-reranker-base
        - --model_path=/models/OpenVINO/bge-reranker-base-int8-ov
        # Digest resolved from the live image that passed native rerank inference.
        image: docker.io/openvino/model_server@sha256:a928903fe429f1e3e27107cc45932d30d95febfd2d1159dc50869c3eac76fc58
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /v2/health/live
            port: http
            scheme: HTTP
          initialDelaySeconds: 120
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 1
        name: ovms
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        # Dual-path real-inference readiness: tiny real rerank request; reports
        # not-ready on a wedged GPU rerank path even when /v2/health/ready is
        # green (task 8.5, Req 5.3/5.4).
        readinessProbe:
          httpGet: null
          exec:
            command:
            - /opt/readiness/rerank-probe.sh
          failureThreshold: 4
          initialDelaySeconds: 15
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "4"
            gpu.intel.com/i915: "1"
            # 12Gi keeps headroom above the measured 5-6.6Gi OVMS footprint.
            memory: 12Gi
          requests:
            cpu: "1"
            gpu.intel.com/i915: "1"
            memory: 2Gi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /models
          name: models
        - mountPath: /opt/readiness
          name: readiness-scripts
          readOnly: true
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - sh
        - -c
        - chown -R 5000:5000 /models
        image: busybox:1.37
        imagePullPolicy: IfNotPresent
        name: model-volume-permissions
        resources: {}
        securityContext:
          runAsUser: 0
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /models
          name: models
      - args:
        - --pull
        - --model_repository_path=/models
        - --source_model=OpenVINO/bge-reranker-base-int8-ov
        - --model_name=bge-reranker-base
        - --task=rerank
        - --target_device=GPU
        image: docker.io/openvino/model_server@sha256:a928903fe429f1e3e27107cc45932d30d95febfd2d1159dc50869c3eac76fc58
        imagePullPolicy: IfNotPresent
        name: model-pull
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /models
          name: models
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 5000
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 30
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: reranker-models
      - name: readiness-scripts
        configMap:
          name: ovms-readiness-scripts
          defaultMode: 0755
